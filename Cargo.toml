[package]
name = "wasm_sys-metrics"
version = "0.1.0"
edition = "2021"
authors = ["Zheng-Bote <zheng.bote@googlemail.com>"]
license = "Apache-2.0"
description = "Configurable system metrics exporter in Rust for WebAssembly / Spin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = { version = "1.0", optional = true }
spin-sdk = { version = "3.1.1", optional = true }

[features]
default = []
spin = ["dep:spin-sdk", "dep:anyhow"]

[dev-dependencies]
