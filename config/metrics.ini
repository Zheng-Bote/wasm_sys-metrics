; Configuration for wasm_sys-metrics
[general]
format = prometheus
prefix = sys_
host = wasm-node

[cpu]
enabled = true
per_core = true

[memory]
enabled = true
swap = true

[loadavg]
enabled = true

[uptime]
enabled = true

[disk]
enabled = true
mounts = /

[network]
enabled = true
interfaces = eth0,lo
