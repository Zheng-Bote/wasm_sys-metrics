version: 1
profile: standard
language: de

# Basis für git diff in pre-merge
base_ref: "main"

artifacts:
  constitution: "constitution.md"
  adr: "docs/adr"
  prd: "docs/prd"
  design: "docs/design"
  plans: "docs/plans"
  archive: "docs/archive"
  docs:
    - "docs/notes"
  architecture: "docs/arc42.md"

tests:
  include:
    - "tests/**/*.rs"
    - "src/**/*_test.rs"

thresholds:
  layers:
    - src/config/**
    - src/collectors/**
    - src/formatters/**
    - src/lib.rs
    - spin.toml
  feature_artifacts_required_when:
    min_layers_touched: 2
    touched_paths:
      - spin.toml
      - Cargo.toml
      - src/lib.rs

exclude:
  - target/**
  - vendor/**
  - .git/**
